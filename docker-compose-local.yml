services:

  api:
    build: 
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - putea-data:/data

  web:
    build: 
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '8000:8000'
    volumes:
      - putea-data:/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: putea
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  putea-data:
  postgres-data: